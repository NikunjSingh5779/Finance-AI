<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>You're offline · FinanceAI</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0b0d;color:#f4f4f5}
    *{box-sizing:border-box}
    body{min-height:100vh;min-height:100dvh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#15251c 0,transparent 48%),#0b0b0d}
    main{width:min(100%,440px);padding:32px;border:1px solid #2c2c32;border-radius:24px;background:#151518;text-align:center;box-shadow:0 24px 80px #0008}
    .brand{width:72px;height:72px;display:grid;place-items:center;margin:0 auto 24px;border-radius:20px;background:#22c55e;color:#0c2016;font-size:34px;font-weight:800;letter-spacing:-2px}
    h1{margin:0 0 12px;font-size:26px}p{color:#a1a1aa;line-height:1.6;margin:0 0 24px}
    button{border:0;border-radius:12px;background:#22c55e;color:#07130b;font:inherit;font-size:16px;font-weight:700;padding:14px 22px;cursor:pointer}
    .hint{display:block;font-size:12px;color:#71717a;margin-top:20px}
  </style>
</head>
<body>
  <main>
    <div class="brand" aria-hidden="true">F</div>
    <h1>You're offline</h1>
    <p>The FinanceAI app shell is available, but your transactions, budgets and AI assistant need an internet connection. Reconnect and try again to load your latest financial data.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <span class="hint">Your private financial data is not stored for offline access.</span>
  </main>
</body>
</html>

<div class="page" id="page-transactions">
        <div class="full-card">
          <div class="full-header transaction-header-actions">
            <h1 class="full-title">All Transactions</h1>
            <div class="transaction-actions">
              <button type="button" class="add-btn compact-action" onclick="openModal()" aria-label="Add transaction" title="Add transaction">+ Add transaction</button>
              <button type="button" class="add-btn compact-action secondary-action" onclick="document.getElementById('csv-input').click()" aria-label="Import CSV" title="Import CSV"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3.5M7.5 8 12 3.5 16.5 8"/><path d="M4 14.5v5h16v-5"/></svg>Import CSV</button>
              <button type="button" class="add-btn compact-action secondary-action" onclick="exportCSV()" aria-label="Export CSV" title="Export CSV"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v12M7.5 11 12 15.5 16.5 11"/><path d="M4 19.5h16"/></svg>Export CSV</button>
              <button type="button" class="add-btn compact-action danger-action" onclick="deleteAllTransactions()" aria-label="Delete all transactions" title="Delete all transactions"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h15M9 7V4.5h6V7M7 7l1 13h8l1-13M10 10.5v6M14 10.5v6"/></svg>Delete all</button>
              <input type="file" id="csv-input" accept=".csv" style="display:none" onchange="importCSV(this)">
            </div>
          </div>
          <div class="transaction-filter-row" aria-label="Transaction type filter">
            <button type="button" class="add-btn compact-action secondary-action txn-filter-btn active" data-filter="all" aria-pressed="true">All</button>
            <button type="button" class="add-btn compact-action secondary-action txn-filter-btn" data-filter="income" aria-pressed="false">Income</button>
            <button type="button" class="add-btn compact-action secondary-action txn-filter-btn" data-filter="expense" aria-pressed="false">Expense</button>
          </div>
          <div class="add-form-grid">
            <div class="fg"><label>Type</label><select id="t-type"><option value="income">Income</option><option value="expense">Expense</option></select></div>
            <div class="fg"><label>Amount (₹)</label><input type="number" id="t-amount" placeholder="0"></div>
            <div class="fg"><label>Description</label><input type="text" id="t-desc" placeholder="Salary, Grocery shopping…"></div>
            <div class="fg"><label>Category</label><input type="text" id="t-category" placeholder="Food, Salary…"></div>
            <div class="fg"><label>Date</label><input type="date" id="t-date"></div>
            <button type="button" class="btn-add" onclick="addTransaction()">Add</button>
          </div>
          <div class="transaction-table-head" aria-hidden="true">
            <span></span><span>Description</span><span>Category</span><span>Amount</span><span>Actions</span>
          </div>
          <div id="all-txns"></div>
        </div>
      </div>

services:
  financeai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financeai
    env_file:
      - .env
    environment:
      DB_PATH: /data/finance.db
    ports:
      - "8000:8000"
    volumes:
      - financeai_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  financeai_data:

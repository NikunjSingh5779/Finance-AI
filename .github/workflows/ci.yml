name: CI

on:
  push:
    branches: [main, fix/realtime-market-data-chat-format]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 .

      - name: Run tests
        run: pytest -q

      - name: Check static frontend syntax and PWA build
        run: |
          node --check app/static/app.js
          node --check app/static/pwa.js
          node --check app/static/sw.js
          node -e "JSON.parse(require('node:fs').readFileSync('app/static/manifest.webmanifest', 'utf8'))"
          node scripts/build-netlify.mjs
          node --check netlify-dist/app.js
          node --check netlify-dist/pwa.js
          node --check netlify-dist/sw.js
          node -e "JSON.parse(require('node:fs').readFileSync('netlify-dist/manifest.webmanifest', 'utf8'))"
          test -s netlify-dist/icons/icon-192.png
          test -s netlify-dist/icons/icon-512.png
          node -e "const fs=require('fs');for(const [file,size] of [['netlify-dist/icons/icon-192.png',192],['netlify-dist/icons/icon-512.png',512]]){const b=fs.readFileSync(file);if(b.readUInt32BE(16)!==size||b.readUInt32BE(20)!==size)throw new Error(file+' must be '+size+'x'+size);}"
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('netlify-dist/manifest.webmanifest','utf8'));for(const icon of m.icons){const f='netlify-dist/'+icon.src;if(!fs.existsSync(f))throw new Error('Missing PWA icon '+f);}"
          grep -q '"purpose": "maskable"' netlify-dist/manifest.webmanifest
          test -s netlify-dist/icons/apple-touch-icon.png
          test -s netlify-dist/offline.html
          ! grep -q '"/static/' netlify-dist/sw.js

name: Deploy FinanceAI to Cloudflare Pages (Free)

on:
  push:
    branches:
      - main
      - fix/realtime-market-data-chat-format
    paths:
      - "app/static/**"
      - "functions/**"
      - "scripts/build-pages.mjs"
      - ".github/workflows/cloudflare-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build and deploy static frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Build FinanceAI static frontend
        run: node scripts/build-pages.mjs
        env:
          FINANCEAI_API_URL: https://finance-ai-u9bo.onrender.com
          # Same-origin mode: the browser talks to the Pages origin and
          # functions/[[path]].js forwards API calls to Render, which keeps the
          # HttpOnly session cookie first-party.
          FINANCEAI_PROXY: "1"

      - name: Verify static output
        shell: bash
        run: |
          test -f pages-dist/index.html
          test -f pages-dist/app.js
          test -f pages-dist/style.css
          test -f pages-dist/_headers
          test -f pages-dist/_routes.json
          test -f 'functions/[[path]].js'
          node scripts/test-auth-proxy.mjs
          test -s pages-dist/manifest.webmanifest
          test -s pages-dist/sw.js
          test -s pages-dist/pwa.js
          test -s pages-dist/offline.html
          test -s pages-dist/icons/icon-192.png
          test -s pages-dist/icons/icon-512.png
          test -s pages-dist/icons/icon-maskable.svg
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('pages-dist/manifest.webmanifest','utf8'));for(const icon of m.icons){const f='pages-dist/'+icon.src;if(!fs.existsSync(f))throw new Error('Missing PWA icon '+f);}"
          node -e "const fs=require('fs');for(const [file,size] of [['pages-dist/icons/icon-192.png',192],['pages-dist/icons/icon-512.png',512]]){const b=fs.readFileSync(file);if(b.readUInt32BE(16)!==size||b.readUInt32BE(20)!==size)throw new Error(file+' must be '+size+'x'+size);}"
          grep -q '"purpose": "maskable"' pages-dist/manifest.webmanifest
          test -s pages-dist/icons/apple-touch-icon.png
          node --check pages-dist/pwa.js
          node --check pages-dist/sw.js
          node -e "JSON.parse(require('node:fs').readFileSync('pages-dist/manifest.webmanifest', 'utf8'))"
          if grep -q 'const API = window.FINANCEAI_API_URL' pages-dist/app.js; then
            echo "The Render API URL was not injected into app.js."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy pages-dist --project-name=finance-ai --branch=${{ github.ref_name }}

      - name: Explain skipped deployment when token is missing
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "::notice::Build passed, but deployment was skipped because CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured in GitHub Actions secrets."
